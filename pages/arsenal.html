<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/assets/css/components/modal.css" />

    <title>Document</title>
  </head>
  <body>
    <div class="wrapper">
      <header class="header">
        <div class="container">
          <nav class="header__nav" aria-label="Main navigation">
            <div class="logo"><a href="/">EldenRing</a></div>
            <ul class="header__nav-links">
              <li class="nav__link"><a href="/pages/guide.html">Guide</a></li>
              <li class="nav__link">
                <a href="/pages/bosses.html" aria-current="page">Bosses</a>
              </li>
              <li class="nav__link"><a href="/pages/tools.html">Tools</a></li>
              <li class="nav__link"><a href="/pages/music.html">Music</a></li>
            </ul>
            <div class="header__social">
              <button id="open__modal" type="button">Contact</button>
            </div>
          </nav>
        </div>
      </header>
    </div>
    <!-- modal -->
    <div class="modal" id="modal">
      <div class="modal_dialog">
        <div class="modal_content">
          <button class="modal__close" id="modal__close-btn">&times;</button>
          <form action="#">
            <div class="modal_title">
              We will get in touch with you as soon as possible!
            </div>

            <input
              required
              class="modal_input"
              id="modal_input_form__title"
              name="name"
              type="text"
              placeholder="Your name" />

            <input
              required
              class="modal_input"
              id="modal_input_form__number"
              name="phone"
              type="tel"
              placeholder="Your phone number" />

            <button class="btn btn_dark btn_min" id="modal__post_form">
              Call us back
            </button>
          </form>
        </div>
      </div>
    </div>
    <script src="/assets/js/components/modal.js"></script>
  </body>
  <script src="/assets/js/components/modal.js"></script>
</html>
