<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Browse Elden Ring bosses by category, region, and location." />
    {{> theme }}
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/pages/bosses.css" />
    <title>Bosses — Elden Ring</title>
  </head>
  <body>
    <div class="wrapper">
      {{> header }}

      <!-- router подменяет только этот блок; страницу целиком строит JS -->
      <div id="page" data-page="bosses">
        <div
          class="page-loader"
          id="page-loader"
          role="status"
          aria-label="Loading">
          <img
            class="page-loader__bonfire"
            src="/assets/video/load/bonfire.gif"
            alt="" />
        </div>
        <main id="boss-root"></main>
      </div>

      {{> footer }}
    </div>

    {{> modal }} {{> game-modal }}

    <script type="module" src="/assets/js/main.js"></script>
  </body>
</html>
