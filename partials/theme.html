<link rel="icon" href="/favicon.ico" sizes="any" />
<script>
  // Тема по сохранённому баннеру (до отрисовки, без мигания)
  try {
    var banner = localStorage.getItem('er:banner');
    var theme = { 'eldenfc3.mp4': 'blood', 'eldenblue2.mp4': 'frost' }[banner];
    if (theme) document.documentElement.dataset.theme = theme;
  } catch (e) {}

  // Страница при полной загрузке всегда открывается сверху
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
</script>

<!-- Пока стили не загрузились, страница скрыта: не видно «голого» HTML -->
<style>
  html {
    background: #0a0907;
  }
  html:not(.is-ready) body {
    opacity: 0;
  }
  body {
    transition: opacity 0.2s ease;
  }
</style>
<script>
  (function () {
    var root = document.documentElement;
    var failed = new WeakSet();
    var links;
    var started = false;
    var ready = function () {
      root.classList.add('is-ready');
    };
    var check = function () {
      if (!links) return;
      var pending = links.some(function (link) {
        return !link.sheet && !failed.has(link);
      });
      if (pending) {
        setTimeout(check, 50);
      } else {
        ready();
      }
    };

    document.addEventListener(
      'error',
      function (event) {
        var link = event.target;
        if (link && link.tagName === 'LINK' && link.rel === 'stylesheet') {
          failed.add(link);
          check();
        }
      },
      true,
    );

    var start = function () {
      if (started || document.readyState === 'loading') return;
      started = true;
      links = [].slice
        .call(document.querySelectorAll('link[rel="stylesheet"]'));
      check();
    };
    document.addEventListener('readystatechange', start);
    start();
  })();
</script>
